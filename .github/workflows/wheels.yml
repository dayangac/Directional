name: Python wheels

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The cibuildwheel settings are in python/pyproject.toml. On macOS, GMP has to be installed before cibuildwheel
      # starts, since the deployment target is read off its library.
      - name: Install GMP
        if: runner.os == 'macOS'
        run: brew install gmp

      - uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
