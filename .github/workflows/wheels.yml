name: Python wheels

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # The cibuildwheel settings are in python/pyproject.toml. On macOS, delocate bundles Homebrew's GMP into the wheel,
      # so the wheel targets the macOS version GMP was built for (cibuildwheel cannot evaluate this in its environment).
      - name: Install GMP
        if: runner.os == 'macOS'
        run: |
          brew install gmp
          echo "MACOSX_DEPLOYMENT_TARGET=$(otool -l $(brew --prefix gmp)/lib/libgmp.dylib | awk '/minos/ {print $2; exit}')" >> $GITHUB_ENV

      - uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
